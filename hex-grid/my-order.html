<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3"><meta name="theme-color" content="#101820"><title>Моя схема — порядок сот</title><style>
:root{color-scheme:dark;--bg:#101820;--panel:#192630;--line:#526674;--text:#edf4f7;--muted:#a9bac4;--active:#f3b64b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:700px;margin:auto;padding:18px 12px 28px}h1{font-size:23px;margin:0 0 7px}p{color:var(--muted);line-height:1.4;margin:6px 0 12px}.info{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:12px 2px}.canvas{background:#14212a;border:1px solid #344854;border-radius:15px;padding:7px;overflow:auto}svg{display:block;width:100%;height:auto;max-height:75vh;min-width:280px}.hex{cursor:pointer;outline:none}.hex polygon{fill:#1c303c;stroke:#718692;stroke-width:1.8}.hex.marked polygon{fill:var(--active);stroke:#ffe0a0;stroke-width:2.5}.hex text{fill:#d9e4e9;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}.hex.marked text{fill:#261b0b}.hex:focus polygon{stroke:white;stroke-width:3.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:11px;font:inherit;font-weight:600}button.primary{background:var(--active);color:#241a0b;border-color:var(--active)}#status{font-size:13px}</style></head><body><main>
<h1>Моя схема — порядок сот</h1><p>Відображені тільки твої 26 сот у початкових позиціях. Натискай їх у потрібній послідовності — номери з'являтимуться всередині.</p><div class="info"><span id="count">Порядок: 0 із 26</span><span>12 × 11</span></div><div class="canvas"><svg id="grid" aria-label="Тільки твої 26 сот"></svg></div><div class="toolbar"><button id="undo">Скасувати останню</button><button id="clear">Скинути</button></div><div class="toolbar"><button class="primary" id="share">Поділитися порядком</button></div><p id="status">Позначай соти в потрібному порядку. Готовий порядок надішли мені посиланням.</p></main>
<script>(()=>{const rows=11,cols=12,ids=[107,118,131,19,25,26,29,31,32,33,36,38,39,40,41,42,45,46,48,52,59,64,70,83,94,95],svg=document.getElementById('grid'),count=document.getElementById('count'),status=document.getElementById('status');let order=[];const NS='http://www.w3.org/2000/svg',R=27,dx=Math.sqrt(3)*R,dy=1.5*R,m=R+8;const el=(t,a={})=>{const n=document.createElementNS(NS,t);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));return n};function hash(){return '#sequence='+order.join('.')};function load(){const s=location.hash.match(/^#sequence=(.*)$/);if(s){const a=(s[1]||'').split('.').filter(Boolean).map(Number);order=a.filter((v,i)=>ids.includes(v)&&a.indexOf(v)===i)}}function draw(){svg.replaceChildren();const w=(cols-1)*dx+dx/2+2*m+R,h=(rows-1)*dy+2*m;svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.setAttribute('preserveAspectRatio','xMidYMid meet');for(const id of ids){const r=Math.floor(id/cols),c=id%cols,x=m+c*dx+(r%2)*dx/2,y=m+r*dy,n=order.indexOf(id),pts=Array.from({length:6},(_,i)=>{const a=(-90+i*60)*Math.PI/180;return (x+R*Math.cos(a))+','+(y+R*Math.sin(a))}).join(' '),g=el('g',{class:'hex'+(n>=0?' marked':''),tabindex:'0',role:'button','aria-label':'Ряд '+(r+1)+', стовпець '+(c+1)});g.append(el('polygon',{points:pts}));const t=el('text',{x,y});t.textContent=n>=0?String(n+1):'·';g.append(t);const pick=()=>{if(n>=0){status.textContent='Ця сота вже має номер '+(n+1)+'. Скасуй кроки, щоб змінити послідовність.';return}order.push(id);draw();history.replaceState(null,'',hash());status.textContent='Додано крок '+order.length+'.'};g.addEventListener('click',pick);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}});svg.append(g)}count.textContent='Порядок: '+order.length+' із 26'}document.getElementById('undo').onclick=()=>{if(order.length){order.pop();draw();history.replaceState(null,'',hash());status.textContent='Останній крок скасовано.'}};document.getElementById('clear').onclick=()=>{order=[];draw();history.replaceState(null,'',hash());status.textContent='Порядок скинуто.'};document.getElementById('share').onclick=async()=>{const url=location.href.split('#')[0]+hash();history.replaceState(null,'',hash());try{await navigator.clipboard.writeText(url);status.textContent='Посилання скопійовано. Надішли його мені.'}catch(e){prompt('Скопіюй посилання:',url)}};load();draw()})();</script></body></html>
